# Default parameters for each pluggable stochastic process.
# The active process is selected in base.yaml (market.process).
# These defaults can be overridden by market.process_params in base.yaml.

default: "gbm"

gbm:
  drift: 0.12
  volatility: 0.18

jump_diffusion:
  drift: 0.10
  volatility: 0.15
  jump_intensity: 0.5
  jump_mean: -0.05
  jump_std: 0.10

regime_switching:
  n_regimes: 3
  regimes:
    - name: "expansion"
      drift: 0.18
      volatility: 0.12
    - name: "normal"
      drift: 0.10
      volatility: 0.18
    - name: "contraction"
      drift: 0.02
      volatility: 0.30
  transition_matrix:
    - [0.90, 0.08, 0.02]
    - [0.05, 0.85, 0.10]
    - [0.10, 0.15, 0.75]
  initial_regime: 0
