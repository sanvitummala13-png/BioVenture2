[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bioventure"
version = "0.1.0"
description = "Stochastic simulation framework for AI-enabled drug discovery market dynamics and venture return modeling"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sanvi Tummala", email = "sanvi.tummala13@gmail.com"},
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "SALib>=1.4",
    "arviz>=0.17",
    "emcee>=3.1",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
